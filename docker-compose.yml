version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: earnbyway-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: earnbyway
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: earnbyway-backend
    restart: always
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/earnbyway?schema=public
      - JWT_SECRET=earnbyway_jwt_secret_key_2026_super_secure_secret
    depends_on:
      - postgres

volumes:
  pgdata:
    driver: local
